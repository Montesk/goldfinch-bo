@import view.{Order, Product}

@(
        headerName: String = "Goldfinch",
        orders: Seq[Order] = Seq(),
        products: Seq[Product] = Seq(),
        product: Option[Product] = None
)(implicit request: Request[AnyContent])

@main("Goldfinch") {
    @navigation(headerName)
    @content(orders, products, product)
}
