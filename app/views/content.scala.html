@import java.time.format.DateTimeFormatter

@import view.home.Order

@(orders: Seq[Order] = Seq())

<div class="container">
  <div class="row">
    <table class="table table-striped">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">ID</th>
          <th scope="col">Status</th>
          <th scope="col">Customer ID</th>
          <th scope="col">Created At</th>
          <th scope="col">Updated At</th>
        </tr>
      </thead>
      <tbody>
        @for((order, idx) <- orders.zipWithIndex) {
          <tr>
            <td>@{idx + 1}</td>
            <td>@order.id</td>
            <td>@order.status</td>
            <td>@order.customer_id</td>
            <td>@order.created_at</td>
            <td>@order.updated_at</td>
          </tr>
        }
      </tbody>
    </table>

    <div style="max-width: 300px">
      <img style="max-width: 100%" src="@routes.Assets.versioned("images/IMG_5581.jpeg")" alt="goldfinch-1">
    </div>

    <div style="width: 300px">
      <img style="max-width: 100%" src="@routes.Assets.versioned("images/кирумба.jpg")" alt="goldfinch-2">
    </div>
  </div>
</div>
