@import view.home.Order
@(data: Seq[Order] = Seq())(implicit request: Request[AnyContent])

<div class="container">
    <div class="row">
        @{
            if(request.path == routes.OrdersController.index.path) {
                orders.content(orders = data)
            } else {
                dashboard.content()
            }
        }
    </div>
</div>
