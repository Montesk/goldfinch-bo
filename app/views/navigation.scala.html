@import view.Products

@(title: String = "Goldfinch")(implicit request: Request[AnyContent])

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand" href="@routes.HomeController.index().url">@title</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item active">
                <a class="nav-link" href="@routes.OrdersController.index().url">Заказы <span class="sr-only">
                    (current)</span></a>
            </li>
            <li class="nav-item active">
                <a class="nav-link" href="@Products.saveQuery(request)">Товары</a>
            </li>
        </ul>
    </div>
</nav>
