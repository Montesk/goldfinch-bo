@import view.Delivery
@import view.Routes

@(data: Seq[Delivery] = Seq())(implicit request: Request[AnyContent])

<div class="col-12">
    <div class="row">
        <div class="col-12 mb-2">
            <a href="@routes.DeliveriesController.create().url" class="text-decoration-none" title="Добавить новое поступление товара">
                <div class="card bo-success-hover bo-horizontal-new-item">
                    <div class="card-body d-flex justify-content-center align-items-center">
                        <h5 class="text-center card-title mb-3 text-success bo-add-small">
                            <span>+</span>
                        </h5>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12">
            <table class="table bo-table">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Product</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Created At</th>
                        <th scope="col">Updated At</th>
                    </tr>
                </thead>
                <tbody>
                @for(delivery <- data) {
                    <tr>
                        <td class="align-middle">@delivery.id</td>
                        <td class="align-middle"><a href="@Routes.ProductPath(delivery.product.id)">@delivery.product.name</a></td>
                        <td class="align-middle">@delivery.quantity</td>
                        <td class="align-middle">@delivery.created_at</td>
                        <td class="align-middle">@delivery.updated_at</td>
                    </tr>
                }
                </tbody>
            </table>
        </div>
    </div>
</div>
