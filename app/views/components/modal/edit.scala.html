@import view.Product

@import helper._

@(
        title: String,
        modalId: String,
        static: Boolean = true,
        product: Product
)(implicit request: RequestHeader)

<div
class="modal fade"
id="@modalId"
tabindex="-1"
aria-labelledby="modal-title"
aria-hidden="true"

    @{
        if(static) {
            """ data-backdrop=static data-keyboard=false """
        } else {
            ""
        }
    }

>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title"><span class="font-weight-normal">@title </span> @product.name</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form method="POST" action="@routes.ProductsController.edit(product.id).url">
                    <div class="form-group">
                        <label for="product-name">Имя</label>
                        <input type="text" class="form-control" id="product-name" name="name" value="@product.name">
                    </div>
                    <div class="form-group">
                        <label for="product-description">Описание</label>
                        <textarea class="form-control" id="product-description" name="description" rows="3">@product.description</textarea>
                    </div>
                    <div class="form-group">
                        <label for="product-price">Цена</label>
                        <input type="text" class="form-control" id="product-price" name="price" value="@product.price">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </div>
                    @CSRF.formField
                </form>
            </div>
        </div>
    </div>
</div>

<script>
        document.addEventListener('DOMContentLoaded', function () {
            $('#@modalId').modal({show: true})
        })
</script>
