@(
        title: String,
        modalId: String,
        static: Boolean = true,
        showOnLoad: Boolean = false,
        redirectUrlOnClose: Option[String] = None,
        bodyContent: Html,
)(implicit request: RequestHeader)

<div
class="modal fade"
id="@modalId"
tabindex="-1"
aria-labelledby="modal-title"
aria-hidden="true"

    @{
        if(static) {
            """ data-backdrop=static data-keyboard=false """
        } else {
            ""
        }
    }

>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">@title</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
            @bodyContent
            </div>
        </div>
    </div>
</div>

<script>
        document.addEventListener('DOMContentLoaded', function () {
            require(["components/modal"], function (modal) {
                @if(showOnLoad) {
                modal.showOnLoad("@modalId");
                }

                @if(redirectUrlOnClose.isDefined) {
                modal.redirectOnModalClose('@modalId', '@redirectUrlOnClose.get');
                }
            })
        })
</script>
