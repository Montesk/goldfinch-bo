@import java.util.UUID

@(
        name: String,
        inputType: String = "text",
        id: String = UUID.randomUUID().toString,
        value: String = "",
        label: String = "",
        cssClass: String = "form-control",
        required: Boolean = false,
)

    @if(label) {
        <label for="@id">@label</label>
    }

    @if(required) {
        <input
        type="@inputType"
        class="@cssClass"
        name="@name"
        id="@id"
        value="@value"
        required
        >
    } else {
        <input
        type="@inputType"
        class="@cssClass"
        name="@name"
        id="@id"
        value="@value"
        >
    }
