@import java.util.UUID
@import view.form.components.SelectOption

@(
        name: String,
        id: String = UUID.randomUUID().toString,
        options: Vector[SelectOption],
        label: String = "",
        cssClass: String = "form-control",
        required: Boolean = false,
        selected: String = "",
)

@if(label) {
    <label for="@id">@label</label>
}

<select
class="@cssClass"
name="@name"
id="@id"
@if(required) { required }>

@for(opt <- options) {
    <option
    value="@opt.value"
    @if(selected == opt.value) { selected } >
    @opt.displayName
    </option>
}
    </select>
