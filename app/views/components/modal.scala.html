@import helper._

@(
        title: String,
        modalId: String,
        static: Boolean = true
)(implicit request: RequestHeader)

<div
class="modal fade"
id="@modalId"
tabindex="-1"
aria-labelledby="modal-title"
aria-hidden="true"

    @{
        if(static) {
            """ data-backdrop=static data-keyboard=false """
        } else {
            ""
        }
    }

>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">Title</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form method="POST" action="@routes.ProductsController.edit().url">
                    <div class="form-group">
                        <label for="product-name">Имя</label>
                        <input type="text" class="form-control" id="product-name" name="name">
                    </div>
                    <div class="form-group">
                        <label for="product-description">Описание</label>
                        <textarea class="form-control" id="product-description" name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="product-price">Цена</label>
                        <input type="text" class="form-control" id="product-price" name="price">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </div>

                    <input type="hidden" id="product-id" name="id" />
                    @CSRF.formField
                </form>
                <form class="mt-5" method="POST" action="@routes.ProductsController.upload" enctype="multipart/form-data">
                    @CSRF.formField
                <div class="custom-file form-group">
                    <input type="file" class="custom-file-input form-control-file" id="product-image" name="image">
                    <label class="custom-file-label" for="product-image">Choose file</label>
                </div>
                <div class="form-group mt-2">
                    <button type="submit" class="btn btn-primary">Upload</button>
                </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
        document.addEventListener('DOMContentLoaded', function () {
            $('#@modalId').on('show.bs.modal', function (event) {
                const button = $(event.relatedTarget)

                const title = button.data('title')
                const description = button.data('description')
                const price = button.data('price')
                const id = button.data('id')

                const modal = $(this)

                modal.find('.modal-title').text('@title ' + title)
                modal.find('#product-name').val(title)
                modal.find('#product-description').text(description)
                modal.find('#product-price').val(price)
                modal.find('#product-id').val(id)
            })
        })
</script>
