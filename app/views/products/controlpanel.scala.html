@import view.models.Products

@()(implicit request: Request[AnyContent])

<div class="col-3">
    <div class="pt-2">
        <div class="bo-control-icon d-inline-block mr-1 @if(Products.isTableView(req = request)) { text-primary } ">
            <a class="text-reset" href="@Products.withQuery(queryString = Some(s"view=${Products.tableView}"))">
                <i class="fa-solid fa-table-list h4" role="button" title="Режим таблицы"></i>
            </a>
        </div>
        <div class="bo-control-icon d-inline @if(Products.isAlbumView(req = request)) { text-primary } ">
            <a class="text-reset" href="@Products.withQuery(queryString = Some(s"view=${Products.albumView}"))">
                <i class="fa-solid fa-grip h4" role="button" title="Режим альбома"></i>
            </a>
        </div>
    </div>
</div>

<div class="col-3">
        <!-- TODO: кол-во записей на странице -->
</div>
