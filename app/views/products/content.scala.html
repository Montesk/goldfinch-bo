@import view.Product
@import view.Products

@(data: Seq[Product] = Seq())(implicit request: Request[AnyContent])

<div class="mt-5 col-12">
    @if(Products.isAlbumView(request)) {
        @products.album(data = data)
    }

    @if(Products.isTableView(request)) {
        @products.table(data = data)
    }
</div>
