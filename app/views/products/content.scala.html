@import view.Product

@(data: Seq[Product] = Seq())(implicit request: RequestHeader)

<div class="row mt-5">
    <div class="col-3">
        <a href="@routes.ProductsController.create().url" class="text-decoration-none" title="Добавить новый товар">
            <div class="card bo-success-hover">
                <div class="card-body">
                    <h5 class="text-center card-title mb-3 text-success bo-add">
                        <span>+</span>
                    </h5>
                </div>
            </div>
        </a>
    </div>
    @for(product <- data) {
        <div class="col-3">
            <div class="card">
                <img class="card-img-top" src="@routes.Assets.versioned("images/product-stub-1.jpg")" alt="Card image cap">
                <div class="card-body">
                    <h5 class="card-title mb-3">@product.name</h5>
                    @if(product.description) {
                        <p class="card-text">Описание: @product.description</p>
                    }
                    <p class="card-text font-weight-bold">Цена: @product.price</p>
                    <a
                    class="btn btn-primary"
                    href="@routes.ProductsController.edit(product.id.toInt).url"
                    role="button"
                    >
                        Редактировать
                    </a>
                </div>
                <div class="card-header text-muted text-monospace small bo-tech-text-60-pct">
                @product.uuid
                </div>
            </div>
        </div>
    }
</div>
