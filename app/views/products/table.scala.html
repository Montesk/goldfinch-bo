@import view.models.Product

@(data: Vector[Product] = Vector())(implicit request: Request[AnyContent])

<div class="row">
    <div class="col-12 mb-2">
        <a href="@routes.ProductsController.create().url" class="text-decoration-none" title="Добавить новый товар">
            <div class="card bo-success-hover bo-horizontal-new-item">
                <div class="card-body d-flex justify-content-center align-items-center">
                    <h5 class="text-center card-title mb-3 text-success bo-add-small">
                        <span>+</span>
                    </h5>
                </div>
            </div>
        </a>
    </div>
    <div class="col-12 mb-2">
        <table class="table bo-table">
            <thead>
                <tr>
                    <th scope="col">Изображение</th>
                    <th scope="col">ID</th>
                    <th scope="col">Название</th>
                    <th scope="col">Цена</th>
                    <th scope="col">Кол-во</th>
                    <th scope="col">Идентификатор</th>
                    <th scope="col">Действия</th>
                </tr>
            </thead>
            <tbody>
            @for(product <- data) {
                <tr>
                    <td>
                        <div class="bo-table-image-wrapper">
                            <img class="mw-100" src="@product.titleImage" alt="@product.titleImage">
                        </div>
                    </td>
                    <td class="align-middle">@product.id</td>
                    <td class="align-middle">@product.name</td>
                    <td class="align-middle">@product.price</td>
                    <td class="align-middle">@product.stock</td>
                    <td class="align-middle">@product.uuid</td>
                    <td class="align-middle">
                        <div class="bo-action d-inline-block" role="button" title="Редактировать">
                            <a href="@Product.saveQueryUriTo(product.id, request)">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </a>
                        </div>
                    </td>
                </tr>
            }
            </tbody>
        </table>
    </div>
    <div class="col-12">
        <nav aria-label="Page navigation example">
            <ul class="pagination justify-content-end">
                <li class="page-item disabled">
                    <a class="page-link" href="#" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                        <span class="sr-only">Previous</span>
                    </a>
                </li>

                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>

                <li class="page-item">
                    <a class="page-link" href="#" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                        <span class="sr-only">Next</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>
