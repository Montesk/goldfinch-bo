## Database
slick.dbs.default {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    driver = "org.postgresql.Driver"
    url="jdbc:postgresql://localhost:5432/goldfinch"
    user=goldfinch
    password=123qwe
    logSql=true
    # numThreads=10
    # maxConnections=8
  }
}

# Migrations
play.evolutions.autocommit = false

# Compile time DI
play.modules.enabled += "modules.Main"

# I18n
play.i18n.langs = [ "ru", "en" ]

# Middlewares
play.filters {
  enabled += filters.LoggingFilter
  enabled += filters.StartPageFilter
}